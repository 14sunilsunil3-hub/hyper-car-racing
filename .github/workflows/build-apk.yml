name: Build PWA APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Bubblewrap CLI
        run: npm i -g @bubblewrap/cli

      # Yeh step Bubblewrap se automatic project initialize karke signed APK bana dega
      - name: Generate Signed APK
        run: |
          bubblewrap init --manifest=https://hyper-car-racing.onrender.com/manifest.json --directory=android-app --skip-validation
          cd android-app
          bubblewrap build
