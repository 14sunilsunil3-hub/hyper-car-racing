<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hyper Car Racing - Aura Gaming</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #030308; color: #fff; }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; padding: 20px;
        }
        .hidden { display: none !important; }

        /* 1. CINEMATIC HYPERCAR SPLASH SCREEN */
        #splash-screen {
            text-align: center; cursor: pointer; position: relative; overflow: hidden;
            background: linear-gradient(180deg, rgba(5, 5, 15, 0.3) 0%, rgba(5, 5, 15, 0.85) 100%), 
                        url('assets/flash.png') no-repeat center center/cover;
        }

        .splash-content {
            z-index: 2;
            background: rgba(0, 0, 0, 0.45);
            padding: 35px 55px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 51, 85, 0.35);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
        }

        /* Bada, Italic & Glowing Game Title */
        .main-title {
            font-size: 58px; 
            font-weight: 900; 
            font-style: italic; 
            letter-spacing: 5px;
            color: #fff; 
            text-transform: uppercase;
            text-shadow: 0 0 12px #ff3355, 0 0 25px #ff3355, 0 0 50px #ff3355, 0 0 80px #ff3355;
            animation: speedGlow 1.8s ease-in-out infinite alternate;
            line-height: 1.1;
        }
        @keyframes speedGlow {
            0% { text-shadow: 0 0 10px #ff3355, 0 0 20px #ff3355; transform: scale(1) skewX(-5deg); }
            100% { text-shadow: 0 0 25px #ff6688, 0 0 50px #ff3355, 0 0 90px #ff3355; transform: scale(1.03) skewX(-5deg); }
        }

        /* Chhota Company Name */
        .company-brand { 
            margin-top: 15px; 
            font-size: 13px; 
            font-weight: 700; 
            color: #00f2fe; 
            letter-spacing: 5px; 
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.7); 
            text-transform: uppercase;
            opacity: 0.9;
        }

        .tap-hint { 
            margin-top: 30px; font-size: 13px; color: #fff; letter-spacing: 2px;
            background: linear-gradient(90deg, #ff2a55, #ff4b2b); padding: 10px 25px; border-radius: 30px;
            box-shadow: 0 0 20px rgba(255, 51, 85, 0.6);
            animation: bounce 1.5s infinite; 
            font-weight: bold;
            display: inline-block;
        }
        @keyframes bounce { 0%, 100% { transform: translateY(0); opacity: 0.85; } 50% { transform: translateY(-4px); opacity: 1; } }

        /* UI Cards */
        .card {
            background: rgba(15, 15, 28, 0.92); padding: 25px 35px; border-radius: 16px;
            width: 90%; max-width: 450px; text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 51, 85, 0.2);
            border: 1px solid rgba(255, 51, 85, 0.3);
            backdrop-filter: blur(10px);
        }
        .card h2 { margin-bottom: 18px; color: #ff3355; font-size: 24px; text-transform: uppercase; letter-spacing: 2px; }
        
        .btn-group { display: flex; gap: 15px; justify-content: center; margin-top: 10px; }
        .card input {
            width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px;
            border: 1px solid #333; background: #0a0a14; color: white; font-size: 14px; outline: none;
        }
        .btn {
            flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; 
            font-size: 15px; cursor: pointer; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-red { background: linear-gradient(to right, #ff2a55, #ff4b2b); color: white; box-shadow: 0 4px 15px rgba(255, 51, 85, 0.4); }
        .btn-blue { background: linear-gradient(to right, #00c6ff, #0072ff); color: white; box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4); }
        .btn-gray { background: #1a1a2e; color: #ccc; border: 1px solid #333; }
        .btn-full { width: 100%; margin-top: 10px; }

        /* Toast */
        #toast {
            position: absolute; top: -60px; left: 50%; transform: translateX(-50%);
            background: #ff3344; color: white; padding: 10px 22px; border-radius: 30px;
            font-size: 14px; font-weight: bold; transition: top 0.4s ease; z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #toast.show { top: 20px; }

        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        #home-ui {
            position: absolute; top: 20px; left: 20px; z-index: 5;
            background: rgba(0,0,0,0.8); padding: 8px 16px; border-radius: 8px;
            font-size: 14px; border-left: 4px solid #ff3355; border: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

    <div id="toast">⚠️ Unstable Connection! Entering Offline Garage.</div>

    <!-- 1. CINEMATIC HYPERCAR SPLASH SCREEN -->
    <div class="screen" id="splash-screen" onclick="showScreen('play-style-screen')">
        <div class="splash-content">
            <div class="main-title">HYPER CAR RACING</div>
            <div class="company-brand">BY AURA GAMING</div>
            <br>
            <div class="tap-hint">⚡ TAP TO START ⚡</div>
        </div>
    </div>

    <!-- 2. PLAY STYLE PAGE -->
    <div class="screen hidden" id="play-style-screen" style="background: radial-gradient(circle at center, #15103a 0%, #05050f 100%);">
        <div class="card">
            <h2>Select Racing Mode</h2>
            <div class="btn-group">
                <button class="btn btn-red" onclick="selectMode('single')">Single Player</button>
                <button class="btn btn-blue" onclick="selectMode('multi')">Multiplayer</button>
            </div>
        </div>
    </div>

    <!-- 3. REGISTER PAGE -->
    <div class="screen hidden" id="register-screen" style="background: radial-gradient(circle at center, #15103a 0%, #05050f 100%);">
        <div class="card" style="max-width: 400px;">
            <h2>Multiplayer Auth</h2>
            <input type="text" id="reg-username" placeholder="Racer Tag">
            <input type="email" id="reg-email" placeholder="Email / FB ID">
            <input type="password" id="reg-pass" placeholder="Password">
            <button class="btn btn-blue btn-full" onclick="submitRegister()">Connect Server</button>
            <button class="btn btn-gray btn-full" onclick="showScreen('play-style-screen')">Back</button>
        </div>
    </div>

    <!-- 4. HOME / GARAGE PAGE -->
    <div class="screen hidden" id="home-screen" style="background: #000;">
        <div id="home-ui">🏎️ Hyper Garage (<span id="mode-indicator">Offline</span>)</div>
        <div id="canvas-container"></div>
        <div style="position: absolute; bottom: 20px; right: 20px; z-index: 5;">
            <button class="btn btn-gray" onclick="location.reload()" style="padding: 8px 20px;">Main Menu</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function selectMode(mode) {
            if (mode === 'single') {
                document.getElementById('mode-indicator').innerText = "Single Player (Offline)";
                showScreen('home-screen');
                initGarageCanvas();
            } else {
                if (navigator.onLine) {
                    showScreen('register-screen');
                } else {
                    const toast = document.getElementById('toast');
                    toast.classList.add('show');
                    setTimeout(() => toast.classList.remove('show'), 3000);
                    setTimeout(() => {
                        document.getElementById('mode-indicator').innerText = "Offline Mode (Fallback)";
                        showScreen('home-screen');
                        initGarageCanvas();
                    }, 1800);
                }
            }
        }

        function submitRegister() {
            const username = document.getElementById('reg-username').value || 'Racer';
            document.getElementById('mode-indicator').innerText = "Multiplayer (" + username + ")";
            showScreen('home-screen');
            initGarageCanvas();
        }

        let isCanvasReady = false;
        function initGarageCanvas() {
            if (isCanvasReady) return;
            isCanvasReady = true;

            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x05050f);

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2.5, 5);
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));

            // Hyper Car Model Box Placeholder
            const carGeo = new THREE.BoxGeometry(1.4, 0.6, 2.8);
            const carMat = new THREE.MeshStandardMaterial({ color: 0xff3355, roughness: 0.3, metalness: 0.8 });
            const car = new THREE.Mesh(carGeo, carMat);
            car.position.y = 0.3;
            scene.add(car);

            // Platform Floor
            const floorGeo = new THREE.CylinderGeometry(3, 3, 0.2, 32);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x151525 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.position.y = -0.1;
            scene.add(floor);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            function animate() {
                requestAnimationFrame(animate);
                car.rotation.y += 0.01;
                floor.rotation.y += 0.01;
                renderer.render(scene, camera);
            }
            animate();
        }
    </script>
</body>
</html>
