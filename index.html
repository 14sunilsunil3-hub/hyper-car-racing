<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hyper Car Racing - Aura Gaming</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #080811; color: #fff; }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #0a0826, #1b1642, #110e2e);
            z-index: 10; padding: 20px;
        }
        .hidden { display: none !important; }

        /* Splash Screen */
        #splash-screen { text-align: center; cursor: pointer; }
        .flash-title {
            font-size: 52px; font-weight: 900; letter-spacing: 5px;
            color: #ff3355; text-transform: uppercase;
            text-shadow: 0 0 25px rgba(255, 51, 85, 0.7);
        }
        .sub-brand { margin-top: 10px; font-size: 16px; color: #ccc; letter-spacing: 2px; }
        .aura-logo { margin-top: 8px; font-size: 20px; font-weight: bold; color: #00d2ff; letter-spacing: 4px; }
        .tap-hint { margin-top: 45px; font-size: 13px; color: #777; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        /* Card Layout */
        .card {
            background: rgba(18, 18, 32, 0.9); padding: 30px; border-radius: 16px;
            width: 100%; max-width: 380px; text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .card h2 { margin-bottom: 20px; color: #ff3355; font-size: 24px; text-transform: uppercase; }
        .card input {
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px;
            border: 1px solid #333; background: #12121d; color: white; font-size: 15px; outline: none;
        }
        .btn {
            width: 100%; padding: 14px; margin-top: 12px; border: none;
            border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer;
            transition: 0.2s; text-transform: uppercase;
        }
        .btn-red { background: linear-gradient(to right, #ff2a55, #ff4b2b); color: white; box-shadow: 0 4px 15px rgba(255, 51, 85, 0.4); }
        .btn-blue { background: linear-gradient(to right, #00c6ff, #0072ff); color: white; box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4); }
        .btn-gray { background: #222233; color: #ccc; }

        /* Toast */
        #toast {
            position: absolute; top: -60px; left: 50%; transform: translateX(-50%);
            background: #ff3344; color: white; padding: 12px 24px; border-radius: 30px;
            font-size: 14px; font-weight: bold; transition: top 0.4s ease; z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #toast.show { top: 20px; }

        /* Garage & Game Canvas */
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        #home-ui {
            position: absolute; top: 20px; left: 20px; z-index: 5;
            background: rgba(0,0,0,0.7); padding: 10px 18px; border-radius: 8px;
            font-size: 15px; border-left: 4px solid #ff3355;
        }
    </style>
</head>
<body>

    <div id="toast">⚠️ Unstable Connection! Entering Offline Garage.</div>

    <!-- 1. SPLASH SCREEN -->
    <div class="screen" id="splash-screen" onclick="showScreen('play-style-screen')">
        <div class="flash-title">Flash 5</div>
        <div class="sub-brand">Hyper Car Racing</div>
        <div class="aura-logo">Aura Gaming</div>
        <div class="tap-hint">Tap anywhere to enter</div>
    </div>

    <!-- 2. PLAY STYLE PAGE -->
    <div class="screen hidden" id="play-style-screen">
        <div class="card">
            <h2>Select Mode</h2>
            <button class="btn btn-red" onclick="selectMode('single')">Single Player</button>
            <button class="btn btn-blue" onclick="selectMode('multi')">Multiplayer (Online)</button>
        </div>
    </div>

    <!-- 3. REGISTER PAGE -->
    <div class="screen hidden" id="register-screen">
        <div class="card">
            <h2>Multiplayer Auth</h2>
            <input type="text" id="reg-username" placeholder="Racer Tag">
            <input type="email" id="reg-email" placeholder="Email / FB ID">
            <input type="password" id="reg-pass" placeholder="Password">
            <button class="btn btn-blue" onclick="submitRegister()">Connect Server</button>
            <button class="btn btn-gray" onclick="showScreen('play-style-screen')">Back</button>
        </div>
    </div>

    <!-- 4. HOME / GARAGE PAGE -->
    <div class="screen hidden" id="home-screen" style="background: #000;">
        <div id="home-ui">🏎️ Hyper Garage (<span id="mode-indicator">Offline</span>)</div>
        <div id="canvas-container"></div>
        <div style="position: absolute; bottom: 30px; z-index: 5;">
            <button class="btn btn-gray" onclick="location.reload()" style="padding: 10px 24px;">Main Menu</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function selectMode(mode) {
            if (mode === 'single') {
                document.getElementById('mode-indicator').innerText = "Single Player (Offline)";
                showScreen('home-screen');
                initGarageCanvas();
            } else {
                if (navigator.onLine) {
                    showScreen('register-screen');
                } else {
                    const toast = document.getElementById('toast');
                    toast.classList.add('show');
                    setTimeout(() => toast.classList.remove('show'), 3000);
                    setTimeout(() => {
                        document.getElementById('mode-indicator').innerText = "Offline Mode (Fallback)";
                        showScreen('home-screen');
                        initGarageCanvas();
                    }, 1800);
                }
            }
        }

        function submitRegister() {
            const username = document.getElementById('reg-username').value || 'Racer';
            document.getElementById('mode-indicator').innerText = "Multiplayer (" + username + ")";
            showScreen('home-screen');
            initGarageCanvas();
        }

        let isCanvasReady = false;
        function initGarageCanvas() {
            if (isCanvasReady) return;
            isCanvasReady = true;

            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a14);

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2.5, 5);
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));

            // Hyper Car Model Box Placeholder
            const carGeo = new THREE.BoxGeometry(1.4, 0.6, 2.8);
            const carMat = new THREE.MeshStandardMaterial({ color: 0xff3355 });
            const car = new THREE.Mesh(carGeo, carMat);
            car.position.y = 0.3;
            scene.add(car);

            // Platform Floor
            const floorGeo = new THREE.CylinderGeometry(3, 3, 0.2, 32);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x222233 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.position.y = -0.1;
            scene.add(floor);

            function animate() {
                requestAnimationFrame(animate);
                car.rotation.y += 0.01;
                floor.rotation.y += 0.01;
                renderer.render(scene, camera);
            }
            animate();
        }
    </script>
</body>
</html>
